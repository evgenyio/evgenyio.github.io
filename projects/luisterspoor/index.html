<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>luisterspoor — Dutch listening and recall practice</title>
  <meta name="description" content="Dutch listening practice for walks and commutes: an everyday phrase in English, a pause to say it yourself, then the Dutch twice. Free, and it works offline.">
  <link rel="canonical" href="https://evgeny.io/projects/luisterspoor/">
  <meta name="theme-color" content="#0a0f1f">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://evgeny.io/projects/luisterspoor/">
  <meta property="og:title" content="luisterspoor — Dutch listening and recall practice">
  <meta property="og:description" content="An everyday phrase in English, a pause to say it yourself, then the Dutch twice. Free, and it works offline.">
  <meta property="og:image" content="https://evgeny.io/projects/luisterspoor/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="luisterspoor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f1f;
      --ink: #f6f1e7;
      --ink-2: rgba(246, 241, 231, 0.66);
      --ink-3: rgba(246, 241, 231, 0.34);
      --line: rgba(246, 241, 231, 0.12);
      --chip: rgba(246, 241, 231, 0.07);
      --glass: rgba(20, 27, 50, 0.78);
      --pop: #17213f;
      --accent: #ff7a2f;
      --accent-soft: rgba(255, 122, 47, 0.14);
      --accent-ring: rgba(255, 122, 47, 0.62);
      --accent-ink: #1c0d03;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body {
      background:
        radial-gradient(90% 55% at 0% 0%, rgba(255, 122, 47, 0.16), transparent 62%),
        radial-gradient(90% 60% at 100% 100%, rgba(52, 92, 214, 0.24), transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
    svg { display: block; width: 100%; height: 100%; }

    .app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }
    .main {
      display: grid;
      grid-template-areas: "top" "strip" "stage" "dock";
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
      width: min(100%, 880px);
      min-height: 0;
      margin: 0 auto;
    }

    /* a quiet, static mark on the track that is playing */
    .eq { display: none; align-items: flex-end; gap: 2px; width: 11px; height: 11px; color: var(--accent); flex: none; }
    .is-playing .is-current .eq { display: inline-flex; }
    .eq i { width: 2.5px; border-radius: 1px; background: currentColor; }
    .eq i:nth-child(1) { height: 45%; }
    .eq i:nth-child(2) { height: 100%; }
    .eq i:nth-child(3) { height: 70%; }

    /* ---------- library rail (wide screens) */
    .rail {
      display: none;
      flex-direction: column;
      gap: 22px;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 16px 28px;
      background: rgba(5, 9, 20, 0.42);
      box-shadow: inset -1px 0 0 var(--line);
      scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }
    .brand { display: flex; align-items: center; gap: 11px; font-family: ui-rounded, "SF Pro Rounded", var(--font); font-size: 16px; font-weight: 750; letter-spacing: -0.01em; }
    .logo { width: 32px; height: 32px; border-radius: 9px; flex: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
    .rail .brand { padding: 0 8px 4px; }
    #railList { display: grid; gap: 26px; }
    .rail h3 {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 8px 10px;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 650;
    }
    .rail h3 span { color: var(--ink-3); font: 500 11px/1 var(--mono); }
    .rail-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      width: 100%;
      margin-bottom: 4px;
      padding: 11px 12px 12px;
      border-radius: 14px;
      text-align: left;
      transition: background 150ms ease;
    }
    .rail-item:last-child { margin-bottom: 0; }
    .rail-item:hover { background: var(--chip); }
    .rail-item.is-current { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent-ring); }
    .rail-name { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; }
    .rail-hint { grid-column: 1 / -1; grid-row: 2; color: var(--ink-3); font-size: 12.5px; }
    .rail-meta { grid-column: 2; grid-row: 1; align-self: center; color: var(--ink-3); font: 500 11.5px/1 var(--mono); white-space: nowrap; }
    .rail-bar { grid-column: 1 / -1; grid-row: 3; height: 3px; margin-top: 9px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .rail-bar i { display: block; width: calc(var(--p, 0) * 100%); height: 100%; border-radius: 2px; background: var(--accent); }

    .elsewhere {
      display: grid;
      gap: 3px;
      margin-top: auto;
      padding: 14px 14px 15px;
      border-radius: 14px;
      box-shadow: inset 0 0 0 1px var(--line);
      color: var(--ink-2);
      font-size: 12.5px;
      line-height: 1.35;
      text-decoration: none;
      transition: box-shadow 150ms ease, color 150ms ease;
    }
    .elsewhere:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
    .elsewhere b { color: var(--ink); font-size: 14px; font-weight: 650; }
    .elsewhere span:first-child { color: var(--ink-3); }
    .chip.link { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); text-decoration: none; }
    .chip.link:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }

    /* ---------- top */
    .top {
      grid-area: top;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 44px;
      padding: calc(env(safe-area-inset-top) + 12px) 22px 2px;
    }
    .category {
      display: none;
      overflow: hidden;
      color: var(--ink-3);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* ---------- track strip (narrow screens) */
    .strip {
      grid-area: strip;
      position: relative;
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding: 10px 22px 12px;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 48px), transparent);
    }
    .strip.at-end { -webkit-mask-image: none; mask-image: none; }
    .strip::-webkit-scrollbar { display: none; }
    .grp { display: grid; gap: 7px; flex: none; }
    .grp-label {
      color: var(--ink-3);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .grp-pills { display: flex; gap: 6px; }
    .chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 14px;
      overflow: hidden;
      border-radius: 12px;
      background: var(--chip);
      color: var(--ink-2);
      font-size: 14.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 150ms ease, color 150ms ease;
    }
    .chip:hover { color: var(--ink); }
    .chip.is-current { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent-ring); }
    .chip-bar { position: absolute; left: 0; bottom: 0; width: calc(var(--p, 0) * 100%); height: 2.5px; background: var(--accent); }

    /* ---------- the lyrics stream */
    .stage { grid-area: stage; position: relative; display: grid; min-height: 0; }
    .stream {
      position: relative;
      min-height: 0;
      overflow-y: auto;
      padding: 0 26px;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 80%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 80%, transparent 100%);
    }
    .stream::-webkit-scrollbar { display: none; }
    /* Spacers let the first and last phrase reach the middle; heights come from JS. */
    .stream::before, .stream::after { content: ''; display: block; }
    .stream::before { height: var(--pad-top, 30vh); }
    .stream::after { height: var(--pad-bottom, 40vh); }
    .line {
      --d: 4;
      padding: 14px 0;
      cursor: pointer;
      opacity: calc(0.36 - var(--d) * 0.05);
      transition: opacity 450ms ease;
    }
    .line:hover { opacity: 0.55; }
    .line.is-current { opacity: 1; cursor: default; }
    .line p { margin: 0; }
    .line .en {
      margin-bottom: 8px;
      color: var(--ink-2);
      font-size: clamp(19px, 5.2vw, 23px);
      font-weight: 500;
      line-height: 1.3;
      text-wrap: pretty;
    }
    .nl {
      font-size: clamp(28px, 7.6vw, 46px);
      font-weight: 720;
      letter-spacing: -0.022em;
      line-height: 1.12;
      text-wrap: pretty;
    }
    .is-verbs .nl { font-size: clamp(22px, 5.6vw, 34px); line-height: 1.22; }
    .w { transition: color 160ms ease; }
    /* While playing, words light up as they are spoken; paused, the whole phrase is lit. */
    .is-playing .is-current .en .w { color: rgba(246, 241, 231, 0.38); }
    .is-playing .is-current .en .w.on { color: var(--ink-2); }
    .is-playing .is-current .nl .w { color: rgba(246, 241, 231, 0.4); }
    .is-playing .is-current .nl .w.on { color: var(--ink); }

    /* "your turn" dots during the recall pause */
    .dots { display: inline-flex; gap: 5px; margin-left: 10px; vertical-align: middle; opacity: 0; transition: opacity 200ms ease; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); transition: background 200ms ease, transform 200ms ease; }
    .dots i.on { background: var(--accent); transform: scale(1.15); }
    .is-thinking .dots { opacity: 1; }

    .back-chip {
      position: absolute;
      left: 50%;
      bottom: 14px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px 9px 11px;
      border-radius: 999px;
      background: var(--glass);
      box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      font-size: 13px;
      font-weight: 600;
      transform: translateX(-50%);
    }
    .back-chip.is-up { top: 10px; bottom: auto; }
    .back-chip[hidden] { display: none; }
    .back-chip .arrow { width: 16px; height: 16px; color: var(--accent); transition: transform 200ms ease; }
    .back-chip.is-up .arrow { transform: rotate(180deg); }

    /* ---------- dock */
    .dock { grid-area: dock; padding: 6px 22px calc(env(safe-area-inset-bottom) + 20px); }
    .scrub { display: flex; align-items: center; height: 22px; cursor: pointer; touch-action: none; border-radius: 4px; }
    .scrub-track { position: relative; width: 100%; height: 4px; overflow: hidden; border-radius: 4px; background: var(--line); transition: height 150ms ease; }
    .scrub:hover .scrub-track, .scrub.is-dragging .scrub-track { height: 8px; }
    .scrub-fill { position: absolute; inset: 0; background: var(--ink); transform: scaleX(var(--p, 0)); transform-origin: left; }
    .times { display: flex; justify-content: space-between; color: var(--ink-3); font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; }
    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto auto 1fr;
      align-items: center;
      gap: clamp(10px, 5vw, 30px);
      margin-top: 12px;
    }
    .speed-wrap { position: relative; justify-self: start; }
    .pill {
      min-width: 56px;
      padding: 9px 12px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px var(--line);
      color: var(--ink-2);
      font: 600 13px/1 var(--mono);
      transition: color 150ms ease, box-shadow 150ms ease;
    }
    .pill:hover, .pill[aria-expanded="true"] { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
    .speed-pop {
      position: absolute;
      left: -6px;
      bottom: calc(100% + 12px);
      z-index: 6;
      display: flex;
      gap: 2px;
      padding: 5px;
      border-radius: 16px;
      background: var(--pop);
      box-shadow: 0 0 0 1px var(--line), 0 18px 40px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(6px) scale(0.97);
      transform-origin: bottom left;
      transition: opacity 140ms ease, transform 140ms ease;
    }
    .speed-pop[hidden] { display: none; }
    .speed-pop.is-open { opacity: 1; transform: none; }
    .speed-pop button {
      min-width: 46px;
      height: 40px;
      padding: 0 7px;
      border-radius: 11px;
      color: var(--ink-2);
      font: 600 13px/1 var(--mono);
    }
    .speed-pop button:hover { background: var(--chip); color: var(--ink); }
    .speed-pop button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
    .ctl { width: 44px; height: 44px; padding: 9px; border-radius: 50%; }
    .ctl:active { transform: scale(0.92); }
    .counter { justify-self: end; color: var(--ink-3); font: 500 12px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .play {
      width: 70px;
      height: 70px;
      padding: 21px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 10px 34px -8px rgba(255, 122, 47, 0.7);
      transition: transform 150ms ease;
    }
    .play:active { transform: scale(0.94); }
    .play[data-icon="play"] { padding-left: 23px; }
    .play.is-waiting { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }

    @media (min-width: 960px) {
      .app { grid-template-columns: 300px minmax(0, 1fr); }
      .rail { display: flex; }
      .strip, .top .brand { display: none; }
      .category { display: block; }
      .top { padding: 24px 40px 0; }
      .stream { padding-left: 40px; padding-right: 40px; }
      .line .en { font-size: 23px; }
      .dock { padding-left: 40px; padding-right: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0ms !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Library">
      <div class="brand"><img class="logo" src="icons/logo.svg" alt="">luisterspoor</div>
      <nav id="railList"></nav>
      <a class="elsewhere" href="https://oefenschrift.nl/">
        <span>Preparing for inburgering?</span>
        <b>oefenschrift.nl ↗</b>
        <span>Free practice for the exams: reading, listening, writing, speaking and KNM.</span>
      </a>
    </aside>

    <div class="main">
      <header class="top">
        <div class="brand"><img class="logo" src="icons/logo.svg" alt="">luisterspoor</div>
        <span class="category" id="category"></span>
      </header>

      <nav class="strip" id="strip" aria-label="What to listen to"></nav>

      <div class="stage">
        <main class="stream" id="stream"></main>
        <button class="back-chip" id="backChip" type="button" hidden><span class="arrow" data-icon-slot="arrowDown"></span>Back to now</button>
      </div>

      <footer class="dock">
        <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Position in track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="scrub-track"><div class="scrub-fill" id="scrubFill"></div></div>
        </div>
        <div class="times"><span id="elapsed">0:00</span><span id="remaining">-0:00</span></div>
        <div class="controls">
          <div class="speed-wrap">
            <button class="pill" id="speed" type="button" aria-label="Playback speed" aria-haspopup="menu" aria-expanded="false">1×</button>
            <div class="speed-pop" id="speedPop" role="menu" aria-label="Playback speed" hidden></div>
          </div>
          <button class="ctl" id="prev" type="button" aria-label="Previous phrase" data-icon-slot="prev"></button>
          <button class="play" id="play" type="button" aria-label="Play"></button>
          <button class="ctl" id="next" type="button" aria-label="Next phrase" data-icon-slot="next"></button>
          <span class="counter" id="counter"></span>
        </div>
      </footer>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script type="module">
    import {
      createPlayer, bindKeys, bindScrubber, formatClock, formatMinutes, escapeHTML, wordLines, nlLines,
      prefersReducedMotion, SPEEDS,
    } from './app/core.js';
    import { icons, setIcon } from './app/icons.js';

    const $ = (selector) => document.querySelector(selector);
    for (const slot of document.querySelectorAll('[data-icon-slot]')) slot.innerHTML = icons[slot.dataset.iconSlot];

    const player = createPlayer({ audio: $('#audio') });
    const { state } = player;
    const stream = $('#stream');
    const strip = $('#strip');
    const EQ = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
    let lines = [];
    let current = null;
    let followPausedUntil = 0;
    let needsRecenter = false;
    let previewFraction = null;
    let lastProgressPaint = 0;

    new ResizeObserver(() => {
      stream.style.setProperty('--pad-top', `${Math.round(stream.clientHeight * 0.38)}px`);
      stream.style.setProperty('--pad-bottom', `${Math.round(stream.clientHeight * 0.55)}px`);
    }).observe(stream);

    // ---------- library: rail on wide screens, strip on phones

    function trackProgress(track) {
      const progress = player.progressOf(track.id);
      const meta = progress.fraction > 0.01 ? `${formatMinutes(progress.remaining)} left` : formatMinutes(track.duration_seconds);
      return { fraction: progress.fraction.toFixed(4), meta };
    }

    function renderLibrary() {
      const currentId = state.track?.id;
      strip.innerHTML = state.sets.map((set) => `
        <div class="grp">
          <span class="grp-label">${escapeHTML(set.short)} · ${escapeHTML(set.levelLabel)}</span>
          <div class="grp-pills">
            ${set.tracks.map((track) => `
              <button class="chip${track.id === currentId ? ' is-current' : ''}" type="button" data-id="${track.id}" aria-pressed="${track.id === currentId}">
                ${EQ}${escapeHTML(track.modeLabel)}<i class="chip-bar" style="--p:${trackProgress(track).fraction}"></i>
              </button>`).join('')}
          </div>
        </div>`).join('') + `
        <div class="grp">
          <span class="grp-label">Inburgering exams</span>
          <div class="grp-pills"><a class="chip link" href="https://oefenschrift.nl/">oefenschrift.nl ↗</a></div>
        </div>`;
      $('#railList').innerHTML = state.sets.map((set) => `
        <section>
          <h3>${escapeHTML(set.title)}<span>${escapeHTML(set.levelLabel)}</span></h3>
          ${set.tracks.map((track) => {
            const { fraction, meta } = trackProgress(track);
            return `
              <button class="rail-item${track.id === currentId ? ' is-current' : ''}" type="button" data-id="${track.id}" aria-pressed="${track.id === currentId}">
                <span class="rail-name">${EQ}${escapeHTML(track.modeLabel)}</span>
                <span class="rail-hint">${escapeHTML(track.modeHint)}</span>
                <span class="rail-meta">${meta}</span>
                <span class="rail-bar"><i style="--p:${fraction}"></i></span>
              </button>`;
          }).join('')}
        </section>`).join('');
      updateStripFade();
    }

    // Keep the playing track's progress fresh without re-rendering the library.
    function paintCurrentProgress() {
      if (!state.track) return;
      const { fraction, meta } = trackProgress(state.track);
      for (const bar of document.querySelectorAll('.chip.is-current .chip-bar, .rail-item.is-current .rail-bar i')) {
        bar.style.setProperty('--p', fraction);
      }
      const railMeta = document.querySelector('.rail-item.is-current .rail-meta');
      if (railMeta) railMeta.textContent = meta;
    }

    function revealCurrentChip(smooth) {
      const chip = strip.querySelector('.chip.is-current');
      if (!chip) return;
      const group = chip.closest('.grp');
      strip.scrollTo({ left: Math.max(0, group.offsetLeft - 22), behavior: smooth && !prefersReducedMotion() ? 'smooth' : 'auto' });
    }

    function updateStripFade() {
      strip.classList.toggle('at-end', strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 4);
    }
    strip.addEventListener('scroll', updateStripFade, { passive: true });

    for (const container of [strip, $('#railList')]) {
      container.addEventListener('click', (event) => {
        const button = event.target.closest('[data-id]');
        if (!button) return;
        followPausedUntil = 0;
        player.loadTrack(button.dataset.id, { autoplay: true });
      });
    }

    // ---------- stream

    const plainLine = (item) => `
      <p class="en">${escapeHTML(item.en)}</p>
      <p class="nl">${nlLines(item).map(escapeHTML).join('<br>')}</p>`;

    function renderStream() {
      stream.classList.toggle('is-verbs', Boolean(state.track?.verbs));
      stream.innerHTML = state.items
        .map((item, index) => `<div class="line" data-i="${index}">${plainLine(item)}</div>`)
        .join('');
      lines = [...stream.children];
      current = null;
    }

    const spans = (words) => words.map((word) => `<span class="w">${escapeHTML(word.text)}</span>`).join(' ');

    function renderCurrent() {
      if (current) {
        current.line.classList.remove('is-current', 'is-thinking');
        current.line.innerHTML = plainLine(current.item);
      }
      const line = lines[state.index];
      const item = state.item;
      if (!line || !item) return;
      const en = wordLines([item.en])[0];
      const nl = wordLines(nlLines(item));
      line.innerHTML = `
        <p class="en">${item.hasPrompt ? spans(en) : escapeHTML(item.en)}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        <p class="nl">${nl.map(spans).join('<br>')}</p>`;
      line.classList.add('is-current');
      current = {
        line,
        item,
        en: { words: en, spans: [...line.querySelectorAll('.en .w')], lit: -1 },
        nl: { words: nl.flat(), spans: [...line.querySelectorAll('.nl .w')], lit: -1 },
        dots: [...line.querySelectorAll('.dots i')],
      };
      lines.forEach((node, index) => node.style.setProperty('--d', Math.min(Math.abs(index - state.index), 4)));
    }

    function light(part, fraction) {
      const count = fraction <= 0 ? 0 : part.words.filter((word) => word.at <= fraction).length;
      if (count === part.lit) return;
      part.spans.forEach((span, index) => span.classList.toggle('on', index < count));
      part.lit = count;
    }

    function center(smooth = true) {
      const line = lines[state.index];
      if (!line) return;
      const top = line.offsetTop + line.offsetHeight / 2 - stream.clientHeight * 0.44;
      stream.scrollTo({ top, behavior: smooth && !prefersReducedMotion() ? 'smooth' : 'auto' });
      needsRecenter = false;
      $('#backChip').hidden = true;
    }

    // The chip points to where the current phrase is: up if you scrolled past it, down otherwise.
    function updateBackChip() {
      const chip = $('#backChip');
      const line = lines[state.index];
      if (!line || !needsRecenter) {
        chip.hidden = true;
        return;
      }
      const top = line.offsetTop - stream.scrollTop;
      const above = top + line.offsetHeight < stream.clientHeight * 0.14;
      const below = top > stream.clientHeight * 0.84;
      chip.hidden = !(above || below);
      chip.classList.toggle('is-up', above);
    }

    const pauseFollow = () => {
      followPausedUntil = performance.now() + 6000;
      needsRecenter = true;
    };
    for (const type of ['wheel', 'touchmove']) stream.addEventListener(type, pauseFollow, { passive: true });
    stream.addEventListener('scroll', () => {
      if (performance.now() < followPausedUntil) followPausedUntil = performance.now() + 6000;
      updateBackChip();
    }, { passive: true });

    stream.addEventListener('click', (event) => {
      const line = event.target.closest('.line');
      if (!line || line.classList.contains('is-current')) return;
      followPausedUntil = 0;
      player.goTo(Number(line.dataset.i));
    });

    $('#backChip').addEventListener('click', () => {
      followPausedUntil = 0;
      center();
    });

    // ---------- dock

    function renderTime() {
      const total = player.duration();
      const t = previewFraction == null ? player.time() : previewFraction * total;
      const fraction = total ? t / total : 0;
      $('#scrubFill').style.setProperty('--p', fraction);
      $('#scrub').setAttribute('aria-valuenow', Math.round(fraction * 100));
      $('#elapsed').textContent = formatClock(t);
      $('#remaining').textContent = `-${formatClock(total - t)}`;
    }

    bindScrubber($('#scrub'), player, (fraction) => {
      previewFraction = fraction;
      renderTime();
    });

    function renderPlay() {
      const button = $('#play');
      const playing = state.playing;
      document.body.classList.toggle('is-playing', playing);
      stream.classList.toggle('is-playing', playing);
      setIcon(button, playing ? 'pause' : 'play');
      button.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      button.classList.toggle('is-waiting', state.waiting);
      if (!playing) paintCurrentProgress();
    }

    $('#play').addEventListener('click', () => player.toggle());
    $('#prev').addEventListener('click', () => { followPausedUntil = 0; player.prev(); });
    $('#next').addEventListener('click', () => { followPausedUntil = 0; player.next(); });

    // ---------- speed: pick any value directly instead of cycling

    const speedPop = $('#speedPop');
    function renderSpeedPop() {
      speedPop.innerHTML = SPEEDS.map((rate) => `
        <button type="button" role="menuitemradio" aria-checked="${rate === state.rate}" data-rate="${rate}">${rate}×</button>`).join('');
    }
    function openSpeed() {
      renderSpeedPop();
      speedPop.hidden = false;
      $('#speed').setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => speedPop.classList.add('is-open'));
    }
    function closeSpeed() {
      speedPop.classList.remove('is-open');
      speedPop.hidden = true;
      $('#speed').setAttribute('aria-expanded', 'false');
    }
    $('#speed').addEventListener('click', () => (speedPop.hidden ? openSpeed() : closeSpeed()));
    speedPop.addEventListener('click', (event) => {
      const option = event.target.closest('[data-rate]');
      if (!option) return;
      player.setRate(Number(option.dataset.rate));
      closeSpeed();
    });
    document.addEventListener('pointerdown', (event) => {
      if (!speedPop.hidden && !event.target.closest('.speed-wrap')) closeSpeed();
    });
    addEventListener('keydown', (event) => { if (event.key === 'Escape') closeSpeed(); });

    // ---------- player events

    player.on('tracks', renderLibrary);

    player.on('track', () => {
      renderLibrary();
      revealCurrentChip(true);
      renderStream();
    });

    player.on('item', () => {
      renderCurrent();
      $('#counter').textContent = `${state.index + 1} / ${state.items.length}`;
      $('#category').textContent = state.item?.category || '';
      if (performance.now() >= followPausedUntil) center(stream.scrollTop > 0);
      else updateBackChip();
    });

    player.on('phase', () => {
      current?.line.classList.toggle('is-thinking', state.phase === 'think');
    });

    player.on('tick', () => {
      renderTime();
      if (performance.now() - lastProgressPaint > 1000) {
        lastProgressPaint = performance.now();
        paintCurrentProgress();
      }
      if (!current) return;
      light(current.en, current.item.hasPrompt ? player.spokenFraction('en') : 1);
      light(current.nl, player.spokenFraction('nl'));
      if (state.phase === 'think') {
        const fraction = player.segmentFraction();
        current.dots.forEach((dot, index) => dot.classList.toggle('on', fraction >= index / 3));
      }
      if (needsRecenter && state.playing && performance.now() >= followPausedUntil) center();
    });

    player.on('play', renderPlay);
    player.on('rate', () => {
      $('#speed').textContent = `${state.rate}×`;
      if (!speedPop.hidden) renderSpeedPop();
    });

    bindKeys(player, {
      '-': () => player.stepRate(-1),
      '[': () => player.stepRate(-1),
      '=': () => player.stepRate(1),
      '+': () => player.stepRate(1),
      ']': () => player.stepRate(1),
    });
    renderPlay();
    player.init().catch((error) => {
      console.error(error);
      $('#category').textContent = 'Could not load tracks';
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      // A page that already had a service worker reloads when a new release takes over,
      // but never in the middle of listening: with audio playing it waits for a pause.
      const hadController = Boolean(navigator.serviceWorker.controller);
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;
        const reload = () => {
          if (reloading) return;
          reloading = true;
          location.reload();
        };
        const audio = document.querySelector('audio');
        if (!audio || audio.paused) reload();
        else audio.addEventListener('pause', reload, { once: true });
      });
      addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(() => navigator.serviceWorker.ready)
          .then((registration) => registration.active && registration.active.postMessage('warm-media'))
          .catch((error) => console.warn('Service worker registration failed', error));
      });
    }
  </script>
</body>
</html>
